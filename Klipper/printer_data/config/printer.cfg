# Tiny-M - Octopus Pro (v1.0/v1.0.1) - migrated from Duet 2 config
#
# Base pin mappings taken from klipper/config/generic-bigtreetech-octopus-pro-v1.0.cfg
# Values below are translated from the working Duet config.g for this machine.
# Lines marked VERIFY are assumptions made during migration that need a physical
# check before you trust them (see chat notes for the full list).
#
# CONFIRMED 2026-09-23: despite the v1.0/v1.0.1 silkscreen, this board's HE0
# heater is physically on PA0, not PA2 (BTT's revisions aren't fully consistent
# here). Root cause of an earlier uncommanded-heating incident: PA0 was mapped
# to stepper_z1's enable_pin (!PA0), so Klipper's default idle/disabled state
# held that pin high and drove the heater on before any homing or heater
# command. Fixed by swapping: extruder heater_pin -> PA0 (uninverted),
# stepper_z1 enable_pin -> !PA2. Verified fix: hotend temp actually drops now.
#
# Extruder and stepper_z2 motor/driver slots were swapped to match BTT's
# reference Octopus Pro Voron2 config (MOTOR6/E0 for extruder, MOTOR4 for
# the third Z leadscrew), since no steppers were wired yet when this change
# was made. See:
# https://github.com/bigtreetech/BIGTREETECH-OCTOPUS-V1.0/blob/master/Octopus%20works%20on%20Voron%20v2.4/Firmware/Klipper/BTT_OctoPus_Pro_V1.1_Voron2_Config.cfg
#
# X/Y endstop_pin values below (PG6=X, PG9=Y) are CONFIRMED CORRECT by manually
# pressing each switch and checking the endstop status panel - matches the true
# Voron/CoreXY convention (X=left/right, Y=front/back). Do NOT swap these -
# swapping them once already caused a homing crash (X drove into the frame).

[gcode_macro PRINT_START]
description: Call from your slicer's start G-code as PRINT_START BED_TEMP=.. EXTRUDER_TEMP=..
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set MESH_PROFILE = 'ABS' if BED_TEMP > 70 else 'PLA' %}
    M140 S{BED_TEMP}                    ; start heating the bed
    M190 S{BED_TEMP}                    ; wait for the bed to FULLY reach temp before any Z referencing below -
                                          ; fixes a persistent "offset always needs to be bigger than measured"
                                          ; first-layer gap: Z was being homed/leveled/meshed cold, then the bed
                                          ; kept expanding/bowing under the probe point as it finished heating
                                          ; during the old M190 (which ran AFTER mesh load). Moved here 2026-11-10.
    G28                                 ; home Y then X then Z together, now bed is hot (see [homing_override] -
                                          ; bare G28 with no params homes all three in one call)
    G28 Z                               ; re-affirm Z reference - redundant given the bare G28 above already
                                          ; homes Z, kept as a harmless no-op rather than risk removing it
    Z_TILT_ADJUST                       ; relevel the gantry against the three Z screws, now hot - matches the
                                          ; conditions PROBE_CALIBRATE should also be run under
    BED_MESH_PROFILE LOAD={MESH_PROFILE} ; PLA mesh below 70C bed, else ABS (see [bed_mesh] profiles)
    M109 S{EXTRUDER_TEMP}               ; wait for the nozzle to finish heating
    G90                                 ; absolute positioning
    G92 E0                              ; reset extruder position
    # Purge/prime line - NOT part of the model, just gets the nozzle flowing cleanly
    # before the real print starts. Runs along the LEFT edge of the bed, well clear
    # of your mesh_min/mesh_max print area (15,15 to 210,200).
    G1 X10 Y20 Z0.3 F5000               ; move to the start of the purge line
    G1 X10 Y190 Z0.3 E20 F800           ; draw the line, priming the nozzle
    G92 E0                              ; reset extruder again so the slicer's own E values start clean

[gcode_macro PRINT_END]
description: Call from your slicer's end G-code. Lowers the bed and parks the head clear.
gcode:
    {% set max_z = printer.configfile.settings['stepper_z'].position_max %}
    {% set cur_z = printer.toolhead.position.z %}
    {% set target_z = [cur_z + 10, max_z] | min %}
    # Lower the bed 10mm (clamped to stepper_z's position_max so this can't error out if
    # the print already finished near the bottom of Z travel).
    G90
    G1 Z{target_z} F300
    # Park at the far right/back corner - G28 X already homes Y first too (see
    # [homing_override]), so this one call is the full "home X and Y" you asked for.
    # Deliberately NOT a bare G28, which would also try to re-home Z here.
    G28 X

[include mainsail.cfg]

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 256   # left/right travel is 256. Duet M208 "Y256" was the real left/right axis (Duet X/Y were swapped)
position_min: 0
position_max: 256
homing_speed: 50

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 251   # endstop is at the BACK, +Y is back, Y homes positive. Front/back travel is 251 (Duet M208 "X251": the back
position_min: 0         # endstop triggers 5mm short of the true edge). Using 256 made Y0 overshoot the front edge by 5mm.
position_max: 251
homing_speed: 50

# Z direction: the three screws agreed with each other but the whole axis was backwards
# (homing lowered the bed instead of raising it to the BLTouch), so all three dir pins
# were flipped together. The Duet needed the same (config.g M569 P2-P4: "Z axis sense
# was inverted"). Relative polarity is unchanged: z1 and z2 are opposite to z.
# Front-left Z leadscrew
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 150

# Rear-centre Z leadscrew (MOTOR_3). Corner roles confirmed by jogging each stepper individually.
[stepper_z1]
step_pin: PG4
dir_pin: PC1   # opposite polarity to stepper_z (this rear motor turns the other way to the front ones)
enable_pin: !PA2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

# Front-right Z leadscrew (MOTOR_4)
[stepper_z2]
step_pin: PF9
dir_pin: PF10   # opposite polarity to stepper_z (BTT's reference has !PF10, but the whole Z axis is flipped here)
enable_pin: !PG2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

[gcode_arcs]
resolution: 0.1   # Added 2026-11-10 - without this section Klipper has no native G2/G3 support and
                  # silently drops arc moves ("Unknown command:"G3""), which desyncs extrusion and
                  # caused a "Move exceeds maximum extrusion" abort on a benchy sliced with arc
                  # fitting enabled. 0.1mm segments (finer than Klipper's 1mm default) for smooth curves.

[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 8.163265   # from Duet M92 E392 @ 16 microsteps - VERIFY if extruder gearing changed
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0   # HE0 (confirmed physically - see header note)
sensor_pin: PF4   # T0
sensor_type: ATC Semitec 104GT-2   # closest stock profile to Duet's generic T100000/B4725 - re-check calibration
#control: pid
#pid_Kp: 22.2   # PLACEHOLDER generic values from the stock Octopus Pro template, NOT
#pid_Ki: 1.08   # translated from Duet (Duet's M307 model-based coefficients don't map to
#pid_Kd: 114    # Klipper Kp/Ki/Kd) - run PID_CALIBRATE HEATER=extruder TARGET=<temp> before real use
min_temp: 0
max_temp: 280                       # from Duet M143 H1 S280
max_extrude_only_velocity: 20       # from Duet M203 E1200mm/min
max_extrude_only_accel: 350         # from Duet M201 E350
pressure_advance: 0.035

[heater_bed]
heater_pin: PA3   # HE1 on this V1.1 board (per Klipper's own generic-bigtreetech-octopus-pro-v1.1.cfg).
                   # SSR's control wires are physically on the board's HE1 connector, not BED (PA1) -
                   # PA1 was never connected to anything, which is why nothing happened no matter what
                   # M140 target was sent. If you ever rewire the SSR onto the BED connector instead,
                   # change this back to PA1.
sensor_pin: PF3   # TB
sensor_type: Generic 3950           # matches Duet's T100000/B3950 bed thermistor
control: watermark   # Duet's M307 H1 "bed heater" line actually reused the extruder's
                      # heater index (H1), so the bed had no PID model and ran bang-bang -
                      # this matches that. Switch to PID + PID_CALIBRATE if you'd prefer tighter control.
min_temp: 0
max_temp: 120                       # from Duet M143 H0 S120
pwm_cycle_time: 0.3   # max Klipper allows; slower switching than the 0.1s default is
                       # kinder to the SSR (bed's thermal mass is slow, doesn't need fast PWM)

[temperature_sensor Enclosure]
sensor_pin: PF5   # T1 - next free thermistor header after T0 (extruder, PF4) and TB (bed, PF3)
sensor_type: Generic 3950   # ASSUMPTION - matches the bed thermistor type; change to match
                             # whatever thermistor you actually wired in if it's a different part
min_temp: 0
max_temp: 100
# TODO: run PID_CALIBRATE HEATER=heater_bed TARGET=60 once you've done a few heat soaks -
# watermark (bang-bang) works but PID holds temperature tighter.

[fan]
pin: PA8   # part cooling fan (Duet fan0)

[heater_fan hotend_fan]
pin: PE5   # hotend/heatsink fan (Duet fan1, thermostatic above 45C)
heater: extruder
heater_temp: 45.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_3A0018000751333231343036-if00
# CAN bus is also available on this board

[printer]
kinematics: corexy
max_velocity: 180          # from Duet M203 X/Y 11000mm/min (~183mm/s), rounded down for headroom
max_accel: 2500              # raised from 800 now input_shaper is tuned (X/Y shaper ceilings
                              # are 4900/4300 - left headroom below that rather than maxing
                              # out on paper; test a real print before pushing further)
max_z_velocity: 15          # from Duet M203 Z1000mm/min (~16.7mm/s), rounded down
max_z_accel: 40              # from Duet M201 Z40mm/s^2
square_corner_velocity: 5   # Klipper's cornering model differs from Duet's M566 jerk settings - default start point, tune later

# X's endstop is on the frame at the far right/back corner, so the carriage must
# be at the back (Y just homed) before X can home. This replaces G28 so that any
# request that includes X (G28, G28 X, G28 X Y, ...) always homes Y first, then X.
# Klipper's stock G28 would home X before Y, which drives X into the frame.
# Z is only homed when explicitly requested (G28 Z, G28 X Z, ...), never as part
# of a bare G28, until the Z home position below has been checked on the machine.
# Before homing Z the toolhead moves to z_home_x / z_home_y so the BLTouch is over
# the bed (at the far right/back corner it is off the bed). Re-derived 2026-11-10 after
# the BLTouch was remounted (offsets now -40, 0): nozzle goes to (168, 128), which puts
# the probe at (128, 128) - still the original Duet-derived bed-centre spot.
# Still VERIFY by jogging there and checking the probe is over the bed.
# Z can never be homed unless X and Y are both homed, either already or earlier in
# this same command. Otherwise the command stops with an error before any movement.
[homing_override]
axes: xyz
gcode:
    {% set z_home_x = 168 %}
    {% set z_home_y = 128 %}
    {% set homed = printer.toolhead.homed_axes %}
    # Bare G28 (Mainsail's "Home All") now homes Z too, now that Z homing/BLTouch/offset
    # are all verified working. An explicit G28 X or G28 Y alone still only homes what you
    # asked for (plus Y before X - see want_y below) without dragging Z along.
    {% set bare_g28 = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set want_x = 'X' in params or bare_g28 %}
    {% set want_y = 'Y' in params or want_x %}
    {% set want_z = 'Z' in params or bare_g28 %}
    {% if want_z and not ((want_x or 'x' in homed) and (want_y or 'y' in homed)) %}
        { action_raise_error("Z cannot be homed until X and Y are both homed. Run G28 first, which homes Y then X.") }
    {% endif %}
    {% if want_x or want_y or want_z %}
        # Always ensure at least 10mm of nozzle-to-bed clearance before any homing move -
        # needed so X/Y travel doesn't scrape the bed, AND so the BLTouch has room to
        # deploy its pin before G28 Z starts probing. This runs every time, not just on
        # the very first home of a session - the bed can be left anywhere (e.g. right at
        # the end of the last print) by the time the next PRINT_START calls G28 again.
        {% if 'z' in homed %}
            # Z is known. BUG FIXED HERE (2026-10-19): this used to force an absolute
            # move to Z=10 unconditionally - which, if the nozzle was already SAFELY
            # further away than 10mm (e.g. PRINT_END lifts clear of a finished print
            # before calling G28 X), would pull it back DOWN to Z=10 - straight into
            # any part on the bed taller than 10mm. This actually happened and plowed
            # a furrow into a finished print. Fixed to only RAISE if currently too
            # close, never lower an already-safe position.
            {% set cur_z = printer.toolhead.position.z %}
            {% set target_z = [cur_z, 10] | max %}
            G90
            G1 Z{target_z} F300
        {% else %}
            # Z is unknown (not homed yet this session), so the bed could be sitting
            # anywhere. SET_KINEMATIC_POSITION fakes the current Z as a known value purely
            # so a relative move is allowed; the G1 that follows then moves the physical
            # bed 10mm further away from the nozzle from wherever it actually is,
            # regardless of what we faked Z as. Increasing Z = bed moves down/away (see
            # the [stepper_z] comment block above about the direction flip).
            SET_KINEMATIC_POSITION Z=0
            G91
            G1 Z10 F300
            G90
        {% endif %}
    {% endif %}
    {% if want_y %}
        G28 Y
    {% endif %}
    {% if want_x %}
        G28 X
    {% endif %}
    {% if want_z %}
        G90
        G0 X{z_home_x} Y{z_home_y} F6000
        G28 Z
    {% endif %}

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.850
hold_current: 0.260
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.850
hold_current: 0.260
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.850
hold_current: 0.260
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.850
hold_current: 0.260
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_z2]
uart_pin: PF2
run_current: 0.850
hold_current: 0.260
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PE1
run_current: 0.600   # PLACEHOLDER - Duet used an external driver so no current value carried over.
hold_current: 0.180  # Check your extruder motor's rated current before first use.
sense_resistor: 0.110
stealthchop_threshold: 0

[bltouch]
sensor_pin: ^PB7   # ^ = pull-up. Klipper's docs say most BLTouches need it; without it "failed to verify sensor state"
control_pin: PB6
x_offset: -40    # probe is 40mm LEFT of the nozzle (measured 2026-11-10, remounted on toolhead)
y_offset: 0      # probe is exactly inline with the nozzle in Y (remounted 2026-11-10)
speed: 2         # from Duet M558 F120 (probe move speed)
lift_speed: 5

[adxl345]
cs_pin: PA15
spi_bus: spi1a   # the board's MCU reports "spi2" as PB13/14/15 - the bus that actually matches
                 # this header's SCK=PB3, MISO=PB4, MOSI=PB5 is named "spi1a" on this firmware
                 # (confirmed from the MCU's own BUS_PINS_spi1a=PB4,PB5,PB3 in klippy.log)

[resonance_tester]
accel_chip: adxl345
probe_points:
    112, 107, 20   # roughly bed centre (mesh area is 15,15 to 210,200), well clear of the nozzle

[input_shaper]
# Re-measured 2026-11-07 after frame stiffening, post Pi swap. X shifted 85.8 -> 76.8 Hz
# (shaper type unchanged); Y unchanged (38.2 -> 38.4 Hz). Suggested max_accel ceilings from
# this run: X <= 3900, Y <= 4300 mm/sec^2 - purely to cut ringing at current speeds, not a
# speed limit change.
shaper_type_x: 3hump_ei
shaper_freq_x: 76.8
shaper_type_y: mzv
shaper_freq_y: 38.4

[bed_mesh]
speed: 100
horizontal_move_z: 6
zero_reference_position: 128, 128  # matches [homing_override]'s z_home_x/z_home_y - without this the mesh's
                                     # own zero point could differ from where Z is actually homed, biasing
                                     # the whole mesh (and therefore every print) up or down. Added 2026-11-10.
mesh_min: 15, 15
mesh_max: 210, 200  # Duet M557 was "X15:200 Y15:210" in its swapped axes (X = front/back, Y = left/right), so here X 15-210, Y 15-200
probe_count: 8, 8   # approximates Duet M557 S25 spacing over that grid
algorithm: bicubic  # default 'lagrange' caps out at 6x6 points

[force_move]
enable_force_move: True

[z_tilt]
# Entries are matched to steppers in order, so the ORDER is what matters:
#   1 = stepper_z  = front-left
#   2 = stepper_z1 = rear-centre
#   3 = stepper_z2 = front-right
# That mapping was confirmed by jogging each stepper individually.
# z_positions = screw locations, from the Duet's "M671 X0:0:320 Y-35:292:128" with
# its swapped axes converted (here x = left/right, y = front/back, +Y = back):
# front-left (-35, 0), front-right (292, 0), rear-centre (128, 320). Note the Duet
# file has an old comment saying the rear screw is off-centre at 163, but its M671
# line uses 128; 128 is used here.
# points = where the NOZZLE goes (Klipper docs), with the BLTouch over the bed. They
# come from the Duet's bed.g "G30 P0 X20 Y20 / P1 X20 Y206 / P2 X196 Y128" (probe
# positions, axes swapped): probe (20,20) (206,20) (128,196). Re-derived 2026-11-10
# after the BLTouch remount using the NEW offset (-40, 0) (nozzle = probe target +
# (40, 0)) - the old points used the previous offset (+30,+40) and, with the probe
# now mounted differently, were landing nowhere near these screws any more, which is
# almost certainly why Z_TILT_ADJUST was diverging ("Probed points range is
# increasing") instead of converging.
z_positions:
    -35, 0
    128, 320
    292, 0
points:
    60, 20
    168, 196
    246, 20
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.01   # tightened from 0.02 - Klipper's docs recommend 0.01 for probe-based
                        # tilt adjustment (matches BLTouch repeatability). retries raised to
                        # 10 to give it enough passes to actually reach the tighter number.

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

